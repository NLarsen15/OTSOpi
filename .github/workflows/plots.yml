# Draws the 7-day plots from data/ and publishes them to GitHub Pages.
# The Pi only pushes CSVs; no images are ever committed.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: Plots

on:
  push:
    branches: [main]
    paths: ["data/**", "stations.json", "assets/**", "plot_cutoffs.py", "hourly_cutoff.py", "stations.py",
            ".github/workflows/plots.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Hourly pushes: only the newest data matters, so drop superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-plots.txt
      - run: pip install -r requirements-plots.txt
      - run: python plot_cutoffs.py site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
